name: Daily Morning Briefing

on:
  # Manual only by default, so nothing runs (or costs anything) until you choose to.
  # To get a briefing every morning, uncomment the two schedule lines below.
  # 6:00 UTC = 7am Irish Standard Time (winter) / 6am Irish Summer Time.
  # schedule:
  #   - cron: '0 6 * * *'
  workflow_dispatch: {}   # run it from the Actions tab with "Run workflow"

jobs:
  run-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Generate and send briefing
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: python3 generate_and_send_briefing.py
